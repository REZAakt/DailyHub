<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyHub</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="DailyHub.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <link href="_content/Radzen.Blazor/css/default.css" rel="stylesheet">
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css">

    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="overlay">
            <div class="loader"></div>
        </div>
    </div>

    <div id="blazor-error-ui" style="z-index:999999;background-color:white;">
        ______  مشکلی پیش آمده . با پشتیبانی تماسی بگیرید  ______
        <a href="." class="reload" style="color:blue;">Reload ↻</a>
        <span class="dismiss" style="color:red;"> 🗙 </span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="js/site.js"></script>
    <script>
        (function () {
            if (window.SVGAnimatedString && !SVGAnimatedString.prototype.includes) {
                SVGAnimatedString.prototype.includes = function (substr) {
                    return String(this.baseVal || '').indexOf(substr) !== -1;
                };
            }
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
        window.playLottie = (elementId, path) => {
            lottie.loadAnimation({
                container: document.getElementById(elementId),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: path
            });
        }
    </script>
</body>

</html>
