<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyHub</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="DailyHub.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />

    <link href="_content/Radzen.Blazor/css/default.css" rel="stylesheet">
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css">

    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="overlay">
            <div class="loader"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <div class="error-overlay">
            <div class="error-card">
                <div class="error-badge">
                    مشکل غیرمنتظره
                </div>

                <h1 class="error-title">
                    اوه! یه مشکلی پیش اومده 😥
                </h1>

                <p class="error-text">
                    برای ادامه، لطفاً با پشتیبانی تماس بگیرید یا صفحه را مجدداً بارگذاری کنید.
                </p>

                <div class="support-box">
                    <p>شماره پشتیبانی:</p>
                    <a class="support-phone" href="tel:09114461400">
                        09114461400
                    </a>
                    <span class="support-hint">
                        (روی شماره بزنید تا تماس بگیرید)
                    </span>
                </div>

                <div class="error-actions">
                    <a href="." class="reload error-btn primary">
                        یه بار دیگه امتحان کن 🔄️
                    </a>

                    <a href="tel:09114461400" class="error-btn secondary">
                        📞 تماس با پشتیبانی
                    </a>
                </div>

                <div class="error-footer">
                    اگر مشکل ادامه داشت، زمان و توضیح خطا را به پشتیبانی اطلاع دهید.
                </div>

                <!--<span class="dismiss error-close">
                    ✕
                </span>-->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var closeBtn = document.querySelector("#blazor-error-ui .dismiss");
            if (closeBtn) {
                closeBtn.addEventListener("click", function () {
                    var errorUi = document.getElementById("blazor-error-ui");
                    if (errorUi) errorUi.style.display = "none";
                });
            }
        });
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.published.js', {
                    updateViaCache: 'none'
                });
            });
        }
    </script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="js/site.js"></script>
    <script>
        (function () {
            if (window.SVGAnimatedString && !SVGAnimatedString.prototype.includes) {
                SVGAnimatedString.prototype.includes = function (substr) {
                    return String(this.baseVal || '').indexOf(substr) !== -1;
                };
            }
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
        window.playLottie = (elementId, path) => {
            lottie.loadAnimation({
                container: document.getElementById(elementId),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: path
            });
        }
    </script>

</body>

</html>
