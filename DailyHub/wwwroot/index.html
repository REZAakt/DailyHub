<body>
    <div id="app">
        <div class="overlay">
            <div class="loader"></div>
        </div>
    </div>

    <div id="blazor-error-ui" style="z-index:999999;background-color:white;">
        ______  مشکلی پیش آمده . با پشتیبانی تماسی بگیرید  ______
        <a href="." class="reload" style="color:blue;">Reload ↻</a>
        <span class="dismiss" style="color:red;"> 🗙 </span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.published.js');
            });
        }
    </script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
    <script src="js/site.js"></script>
    <script>
        (function () {
            if (window.SVGAnimatedString && !SVGAnimatedString.prototype.includes) {
                SVGAnimatedString.prototype.includes = function (substr) {
                    return String(this.baseVal || '').indexOf(substr) !== -1;
                };
            }
        })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
        window.playLottie = (elementId, path) => {
            lottie.loadAnimation({
                container: document.getElementById(elementId),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: path
            });
        }
    </script>
